<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call Invites</title>
    <meta name="description" content="Connect with us through video calls">
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            transition: background-color 0.3s, color 0.3s;
        }

        body.light-mode {
            background-color: #f8f9fa;
            color: #212529;
        }

        body.dark-mode {
            background-color: #1a1a1a;
            color: #e9ecef;
        }

        .navbar-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            margin-bottom: 2rem;
        }

        .navbar-custom h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .theme-toggle {
            background: none;
            border: 1px solid currentColor;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .light-mode .card {
            background-color: white;
            color: #212529;
            border: 1px solid #dee2e6;
        }

        .dark-mode .card {
            background-color: #2d2d2d;
            color: #e9ecef;
            border: 1px solid #444;
        }

        .card {
            text-decoration: none;
            transition: none;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .card-text {
            font-size: 0.95rem;
        }

        .copy-link {
            font-size: 0.85rem;
            font-family: monospace;
            word-break: break-all;
            padding: 0.5rem;
            border-radius: 0.25rem;
            background: rgba(0, 0, 0, 0.05);
            margin-top: 0.5rem;
        }

        .light-mode .copy-link {
            background: #f0f0f0;
            color: #333;
        }

        .dark-mode .copy-link {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
        }

        .copy-btn {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            margin-top: 0.5rem;
        }

        footer {
            margin-top: 3rem;
            padding-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.7;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        .light-mode footer {
            border-top-color: rgba(0, 0, 0, 0.1);
        }

        .dark-mode footer {
            border-top-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="light-mode">
    <div class="container">
        <div class="navbar-custom">
            <h1>Video Call Invites</h1>
            <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
        </div>

        <div class="row" id="cardsContainer">
            <!-- Cards will be generated here -->
        </div>

        <footer>
            <p>© 2026 Video Call Invites. All rights reserved.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Data configuration
        const cardsData = [
            {
                id: 1,
                title: 'Jeewani',
                description: 'Video call with Jeewani',
                link: 'jeewani.html'
            },
            {
                id: 2,
                title: 'Lathika',
                description: 'Video call with Lathika',
                link: 'lathika.html'
            },
            {
                id: 3,
                title: 'Sandamini',
                description: 'Video call with Sandamini',
                link: 'sandamini.html'
            },
            {
                id: 4,
                title: 'Rupika',
                description: 'Video call with Rupika',
                link: 'rupika.html'
            },
            {
                id: 5,
                title: 'Kumari Saudi',
                description: 'Video call with Kumari',
                link: 'kumari-saudi.html'
            }
            // Add more cards like this:
            // {
            //     id: 6,
            //     title: 'Name',
            //     description: 'Description here',
            //     link: 'page.html'
            // }
        ];

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        // Check saved theme preference
        const savedTheme = localStorage.getItem('theme') || 'light-mode';
        body.classList.add(savedTheme);
        updateThemeButton();

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            body.classList.toggle('dark-mode');
            
            const currentTheme = body.classList.contains('dark-mode') ? 'dark-mode' : 'light-mode';
            localStorage.setItem('theme', currentTheme);
            updateThemeButton();
        });

        function updateThemeButton() {
            themeToggle.textContent = body.classList.contains('dark-mode') ? '☀️ Light' : '🌙 Dark';
        }

        // Generate cards
        function generateCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            cardsData.forEach((card) => {
                const colDiv = document.createElement('div');
                colDiv.className = 'col-12 col-sm-6 col-lg-4 col-xl-2.4 mb-4';
                
                const url = window.location.origin + window.location.pathname.replace('index.html', '') + card.link;
                
                colDiv.innerHTML = `
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">${card.title}</h5>
                            <p class="card-text">${card.description}</p>
                            <div class="copy-link" id="link-${card.id}">${url}</div>
                            <button class="btn btn-sm btn-outline-primary copy-btn" onclick="copyToClipboard('link-${card.id}')">Copy Link</button>
                        </div>
                        <div class="card-footer bg-transparent">
                            <a href="${card.link}" class="btn btn-primary w-100 btn-sm">Open</a>
                        </div>
                    </div>
                `;
                container.appendChild(colDiv);
            });
        }

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        document.addEventListener('DOMContentLoaded', generateCards);
    </script>
</body>
</html>
